[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zin-verify"
version = "0.2.0"
description = "Run Zin specifications as conformance tests in pytest and unittest"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eneko Sarasola" }]
keywords = ["specification", "model-checking", "conformance", "pytest", "unittest"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/enekos/zin"

[tool.setuptools]
packages = ["zin"]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.entry-points.pytest11]
zin = "zin.pytest_plugin"
