name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ZIN_BIN: ${{ github.workspace }}/target/debug/zin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: Check and audit the examples
        run: |
          "$ZIN_BIN" check examples/*.zin
          for spec in examples/*.zin; do "$ZIN_BIN" audit "$spec"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python binding
        working-directory: bindings/python
        run: |
          python -m pip install pytest
          python -m pytest -q
          python -m unittest discover -s tests -p 'test_account.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript binding
        working-directory: bindings/js
        run: node --test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go binding
        working-directory: bindings/go
        run: |
          go vet ./...
          go test ./...
