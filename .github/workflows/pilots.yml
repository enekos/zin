name: Conformance pilots
on: [push, pull_request]

jobs:
  pilots:
    runs-on: ubuntu-latest
    env:
      ZIN_BIN: ${{ github.workspace }}/target/debug/zin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: examples/pilots
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm test
          npm run test:browser

  junit:
    runs-on: ubuntu-latest
    env:
      ZIN_BIN: ${{ github.workspace }}/target/debug/zin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JUnit binding and the shared contract cases
        run: mvn -B -f bindings/junit/pom.xml install
      - name: ByteBuffer pilot
        run: mvn -B -f examples/pilots/junit/pom.xml test
      - name: Generated skeleton compiles
        run: examples/pilots/check-scaffold.sh
