[package]
name = "zin-spec"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "English-like specifications, exhaustively model checked, then run as conformance tests inside your test framework"
license = "MIT"
repository = "https://github.com/enekos/zin"
homepage = "https://github.com/enekos/zin"
readme = "README.md"
keywords = ["specification", "model-checking", "testing", "conformance", "formal-methods"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE"]

[lib]
name = "zin"
path = "src/lib.rs"

[[bin]]
name = "zin"
path = "src/main.rs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
